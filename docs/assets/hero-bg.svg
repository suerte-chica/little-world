<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="hero-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="orb1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1440" height="500" fill="url(#hero-gradient)"/>
  <rect width="1440" height="500" fill="url(#orb1)"/>
  <rect width="1440" height="500" fill="url(#orb2)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="400" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="60"/>
  <circle cx="1350" cy="100" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="50"/>
  <circle cx="720" cy="250" r="350" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="80"/>
  <!-- Grid lines -->
  <line x1="0" y1="125" x2="1440" y2="125" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="250" x2="1440" y2="250" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="375" x2="1440" y2="375" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="1080" y1="0" x2="1080" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
</svg>
